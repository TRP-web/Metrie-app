version: '3.8'

services:
  front-end:
    container_name: metrie-front-end
    build:
      context: ./front-end
      dockerfile: Dockerfile.prod
    ports:
      - 3000:3000
    command: npm start
  back-end:
    container_name: metrie-back-end
    build: back-end/
    ports:
      - 3001:3001
    command: node index.js
